<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#f4e7d2" />
  <title>小小畫家拼圖</title>
  <style>
    :root {
      --bg: #f4e7d2;
      --panel: rgba(255,255,255,.82);
      --ink: #544238;
      --accent: #dc8fa4;
      --accent-dark: #b96d84;
      --shadow: 0 12px 30px rgba(86, 58, 45, .18);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.75), transparent 34%),
        linear-gradient(160deg, #f7ecdb 0%, #ecd8c8 100%);
      overscroll-behavior: none;
      touch-action: none;
    }

    #app {
      width: 100%;
      max-width: 100%;
      height: 100dvh;
      min-height: 100%;
      overflow: hidden;                 /* 防止任何橫向溢出 */
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
    }

    .topbar, .bottombar {
      width: min(720px, 100%);
      max-width: 100%;
      margin: 0 auto;
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .topbar {
      min-height: 64px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      overflow: hidden;
    }

    .title-wrap { min-width: 0; overflow: hidden; }
    h1 { margin: 0; font-size: clamp(18px, 4.5vw, 26px); letter-spacing: .04em; white-space: nowrap; }
    .subtitle {
      margin-top: 2px; font-size: 12px; opacity: .72;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .topbar-right { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

    .stats { display: flex; gap: 6px; flex: 0 0 auto; }
    .stat {
      min-width: 54px;
      padding: 6px 8px;
      border-radius: 12px;
      background: rgba(255,255,255,.72);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .stat span { display: block; font-size: 10px; opacity: .65; }
    .stat strong { display: block; font-size: 16px; }

    #game-shell {
      position: relative;
      width: min(720px, 100%);
      max-width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 22px;
      background: rgba(255,255,255,.3);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.6), var(--shadow);
    }

    #pixi-container { width: 100%; height: 100%; }
    #pixi-container canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    .bottombar {
      min-height: 58px;
      padding: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    /* button 與 .btn（label 版按鈕）共用外觀 */
    button, .btn {
      border: 0;
      border-radius: 14px;
      padding: 10px 8px;
      font: inherit;
      font-weight: 800;
      color: white;
      background: linear-gradient(180deg, var(--accent), var(--accent-dark));
      box-shadow: 0 6px 14px rgba(185,109,132,.28);
      cursor: pointer;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    button, .btn, .icon-btn {
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    button:active, .btn:active { transform: translateY(1px) scale(.99); }
    button.secondary, .btn.secondary { color: var(--ink); background: rgba(255,255,255,.9); box-shadow: none; }
    button:disabled, .btn.is-busy { opacity: .55; cursor: default; pointer-events: none; }

    /* 頂端「換照片」小按鈕（label） */
    .icon-btn {
      flex: 0 0 auto;
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink);
      background: rgba(255,255,255,.9);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      cursor: pointer;
    }
    .icon-btn:active { transform: translateY(1px) scale(.99); }
    .icon-btn .emoji { font-size: 16px; }
    .icon-btn .label { display: none; }               /* 手機上只留圖示 */
    @media (min-width: 520px) { .icon-btn .label { display: inline; } }
    @media (max-width: 480px) { .subtitle { display: none; } }

    /* 覆蓋層（開始選照片、完成畫面共用樣式） */
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(64,42,35,.35);
      backdrop-filter: blur(8px);
      z-index: 20;
    }
    .overlay.show { display: grid; }

    .card {
      width: min(360px, 100%);
      padding: 26px 20px;
      border-radius: 24px;
      background: rgba(255,250,245,.96);
      text-align: center;
      box-shadow: 0 20px 50px rgba(57,35,28,.28);
      animation: pop .35s ease-out;
    }
    .card .emoji { font-size: 56px; line-height: 1; }
    .card h2 { margin: 8px 0 6px; font-size: 26px; }
    .card p { margin: 0 0 18px; line-height: 1.6; }
    .card button, .card .btn { width: 100%; }
    .card :is(button, .btn) + :is(button, .btn) { margin-top: 10px; }

    @keyframes pop { from { transform: scale(.82); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* 視覺上隱藏但仍可被 label 觸發（不可用 display:none，否則手機開不了相簿） */
    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0);
      white-space: nowrap; border: 0;
    }

    @media (max-height: 620px) {
      .topbar { min-height: 52px; padding: 7px 10px; }
      .bottombar { min-height: 50px; padding: 6px; }
      button, .btn { padding: 8px 6px; }
    }
  </style>
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div class="title-wrap">
        <h1>小小畫家拼圖</h1>
        <div class="subtitle">拖曳拼圖片，靠近正確位置就會自動吸附</div>
      </div>
      <div class="topbar-right">
        <label class="icon-btn" id="change-photo-btn" for="photo-input">
          <span class="emoji">📷</span><span class="label">換照片</span>
        </label>
        <div class="stats">
          <div class="stat"><span>時間</span><strong id="time">00:00</strong></div>
          <div class="stat"><span>移動</span><strong id="moves">0</strong></div>
        </div>
      </div>
    </header>

    <section id="game-shell">
      <div id="pixi-container"></div>

      <!-- 首次進入：先選一張照片 -->
      <div id="start-panel" class="overlay">
        <div class="card">
          <div class="emoji">🖼️</div>
          <h2>先選一張照片</h2>
          <p>從相簿挑一張喜歡的照片，<br>就能把它變成拼圖囉！</p>
          <label class="btn" id="pick-photo-btn" for="photo-input">選擇照片</label>
        </div>
      </div>

      <!-- 完成畫面 -->
      <div id="win-panel" class="overlay">
        <div class="card">
          <div class="emoji">🎉</div>
          <h2>拼圖完成！</h2>
          <p id="win-text">完成時間 00:00，共移動 0 次。</p>
          <button id="play-again">用同一張再玩一次</button>
          <label class="btn secondary" id="win-change-photo" for="photo-input">換一張照片</label>
        </div>
      </div>
    </section>

    <nav class="bottombar">
      <button class="secondary" id="preview-btn">按住看原圖</button>
      <button id="shuffle-btn">重新打亂</button>
      <button class="secondary" id="level-btn">難度：3 × 4</button>
    </nav>
  </main>

  <!-- 隱藏但可被上面三個 label 觸發的相簿選取器 -->
  <input type="file" id="photo-input" class="visually-hidden" accept="image/*" />

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
